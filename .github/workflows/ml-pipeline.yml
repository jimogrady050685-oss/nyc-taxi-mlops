# .github/workflows/ml-pipeline.yml
# ==================================
# This is the main pipeline. It runs three jobs in sequence:
#
#   preprocess  >>  train  >>  build-image
#
# Each job runs on its own fresh Ubuntu runner.
# Data moves between jobs using GitHub artifacts so nothing is shared on disk.
# The run ID is baked into every artifact name so you can trace any model
# back to the exact data that produced it.
#
# Triggers on a push to main but only if a relevant file actually changed.
# Changing the README will not kick this off.

name: "ML Pipeline — Preprocess, Train, Build"

on:
  push:
    branches: [main]
    paths:
      - "preprocess.py"
      - "train.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/ml-pipeline.yml"

  # Can also be triggered manually from the Actions tab.
  # retrain.yml calls this workflow the same way.
  workflow_dispatch:
    inputs:
      sample_fraction:
        description: "How much of the dataset to use (0.0 to 1.0). Smaller is faster."
        default: "0.05"
        required: false

jobs:

  # Job 1: pull the NYC TLC data, clean it and engineer the features.
  # Output is features.parquet uploaded as an artifact for the train job.
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs preprocess.py. Downloads the TLC parquet, cleans it and
      # writes the engineered features out to processed/features.parquet.
      - name: Run preprocessing
        env:
          SAMPLE_FRACTION: ${{ github.event.inputs.sample_fraction || '0.05' }}
        run: |
          mkdir -p processed
          python -c "
          import preprocess, pandas as pd
          train_df, val_df = preprocess.run_pipeline()
          combined = pd.concat([train_df, val_df])
          combined.to_parquet('processed/features.parquet', index=False)
          print(f'Wrote {len(combined):,} rows to processed/features.parquet')
          "

      # Tag the artifact with the run ID so it can be matched to the model later.
      - name: Upload features artifact
        uses: actions/upload-artifact@v4
        with:
          name:           features-${{ github.run_id }}
          path:           processed/features.parquet
          retention-days: 7


  # Job 2: train the model on the features produced above.
  # MLflow logs every run so you get full parameter and metric history.
  # Will not start unless the preprocess job completed successfully.
  train:
    runs-on: ubuntu-latest
    needs: preprocess

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pull down the features artifact from the preprocess job above.
      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: features-${{ github.run_id }}
          path: processed/

      # FEATURES_PARQUET tells train.py to skip the download and use what
      # preprocess already produced. GITHUB_SHA is stored as an MLflow tag
      # so any model can be traced back to the exact commit that built it.
      - name: Run training with MLflow
        env:
          FEATURES_PARQUET:    processed/features.parquet
          MLFLOW_TRACKING_URI: file:./mlruns
          GITHUB_SHA:          ${{ github.sha }}
          SAMPLE_FRACTION:     ${{ github.event.inputs.sample_fraction || '0.05' }}
        run: |
          mkdir -p models
          python train.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_id }}
          path: |
            models/gbt_model.joblib
            models/metrics.json
          retention-days: 30

      # Keeping the mlruns directory as an artifact means you can download
      # and inspect any historical run directly from the Actions tab.
      - name: Upload MLflow runs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/
          retention-days: 30

      - name: Print metrics
        run: cat models/metrics.json


  # Job 3: bake the trained model into a Docker image and push it to Docker Hub.
  # Argo CD watches the cluster and will pull the new image automatically.
  # Will not start unless the train job completed successfully.
  build-image:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Dockerfile copies models/ into the image so the model needs
      # to be on disk here before the build runs.
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.run_id }}
          path: models/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push two tags. The SHA tag gives you a permanent record of what was deployed.
      # The latest tag is what the Kubernetes deployment.yaml points to.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push:    true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nyctaxi-fare:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nyctaxi-fare:${{ github.sha }}

      # Argo CD reconciles every 3 minutes. Once it detects the new image
      # it will do a rolling update on the Kind cluster with no manual steps needed.
      - name: Confirm image pushed
        run: |
          echo "Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/nyctaxi-fare:latest"
          echo "Argo CD will sync to the Kind cluster within 3 minutes."