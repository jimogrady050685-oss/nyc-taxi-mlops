# .github/workflows/ml-pipeline.yml
# ==================================
# This is the workflow. It should demonstrate:
#   1. Data Acquisition & Preprocessing  (stage 1)
#   2. Model Training & Testing          (stage 2)  ← MLflow logged
#   3. Continuous Delivery               (stage 5)  ← image pushed → Argo CD picks up
#
#   preprocess  >>  train  >>  build-image
#
# The three jobs run on separate Ubuntu runners. Data flows between them
# via actions/upload-artifact + actions/download-artifact
#
# ml-pipeline.yml runs the full pipeline as three separate jobs.
# Job one downloads the NYC TLC dataset, cleans it, engineers features, and uploads the result as a GitHub artifact. 
# Job two needs job one, downloads that artifact, trains the GBT model with MLflow tracking, and uploads the .joblib model 
# AND the mlruns directory as artifacts.
# Job three needs job two, downloads the model, bakes it into a Docker image, and pushes the image to Docker Hub. 
# Each artifact is versioned by run-ID so I have full data and model lineage across every pipeline run."

name: ML Pipeline — Preprocess → Train → Build

on:
  push:
    branches: [main]
    paths:
      - "preprocess.py"
      - "train.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/ml-pipeline.yml"

  # Manual trigger: also doubles as the Continuous Training entry point
  workflow_dispatch:
    inputs:
      sample_fraction:
        description: "How much of the dataset to use (0.0 to 1.0). Smaller is faster."
        default: "0.05"
        required: false
  workflow_call:
    inputs:
      sample_fraction:
        description: "Sample fraction (0.0-1.0). Smaller = faster runs."
        default: "0.05"
        required: false
        type: string
jobs:

  # Stage 1: Data Acquisition & Preprocessing 
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run preprocess.py: downloads NYC TLC parquet, cleans, feature-engineers,
      # writes processed/features.parquet to disk.
      - name: Run preprocessing
        env:
          SAMPLE_FRACTION: ${{ github.event.inputs.sample_fraction || '0.05' }}
        run: |
          mkdir -p processed
          python -c "
          import preprocess, pandas as pd
          train_df, val_df = preprocess.run_pipeline()
          combined = pd.concat([train_df, val_df])
          combined.to_parquet('processed/features.parquet', index=False)
          print(f'Wrote {len(combined):,} rows to processed/features.parquet')
          "

      # Upload features as artifact — this is the data lineage point
      # Data flows between jobs via artifacts, never via shared filesystem (because jobs run on different runners).
      - name: Upload features artifact
        uses: actions/upload-artifact@v4
        with:
          name:           features-${{ github.run_id }}
          path:           processed/features.parquet
          retention-days: 7

  # Stage 2: Model Training & Testing (with MLflow)
  train:
    runs-on: ubuntu-latest
    needs: preprocess

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pull down the features artifact from the preprocess job above.
      - name: Download features artifact
        uses: actions/download-artifact@v4
        with:
          name: features-${{ github.run_id }}
          path: processed/

      # Train the model. train.py reads FEATURES_PARQUET env var to skip the download step and 
      # load the already-preprocessed features directly.
      - name: Run training with MLflow
        env:
          FEATURES_PARQUET:    processed/features.parquet
          MLFLOW_TRACKING_URI: file:./mlruns
          GITHUB_SHA:          ${{ github.sha }}
          SAMPLE_FRACTION:     ${{ github.event.inputs.sample_fraction || '0.05' }}
        run: |
          mkdir -p models
          python train.py

      # Upload the trained model which is consumed by the build-image job next
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_id }}
          path: |
            models/gbt_model.joblib
            models/metrics.json
          retention-days: 30

      # Upload mlruns directory
      # This is the model lineage / experiment history.
      # You can download this from the GitHub Actions UI and run `mlflow ui` locally to see every run side-by-side, 
      # with hyperparameters and metrics.
      - name: Upload MLflow runs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/
          retention-days: 30

      - name: Print metrics
        run: cat models/metrics.json

  # Stage 3: Build Docker image and push to Docker Hub
  build-image:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the trained model into the local models/ directory so the Dockerfile's COPY models/ ./models/ picks it up
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-${{ github.run_id }}
          path: models/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push. 
      # Tag with both git SHA (for traceability) and :latest (so the Kubernetes deployment.yaml's image: ...:latest line works).
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push:    true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nyctaxi-fare:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nyctaxi-fare:${{ github.sha }}

      # At this point Argo CD takes over.
      # Because deployment.yaml uses imagePullPolicy: Always, the next time
      # Argo CD reconciles (within ~3 min) it will re-pull :latest and Kubernetes will perform a rolling update.
      - name: Image pushed
        run: |
          echo "Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/nyctaxi-fare:latest"
          echo "Argo CD will sync to the Kind cluster within 3 minutes."