# .github/workflows/ci.yml — Continuous Integration smoke test
# ==============================================================
# Triggers on: every push to non-main branches, and every PR targeting main.

# Purpose: catch broken Python imports, preprocessing regressions, and Flask app errors before they reach main 
# (where ml-pipeline.yml runs the full preprocess → train → build → deploy chain).
#
# This is intentionally small volume and it does not download the full size dataset which is 1.4 GB
# As a result it does not train a real model, and does not push any images.
# It just confirms the code is structurally sound.
#

name: "CI — Smoke Test"

on:
  push:
    branches-ignore: [main]      # main is handled by ml-pipeline.yml
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — preprocessing on synthetic data
        run: python scripts/test_preprocess.py

      - name: Smoke test — Flask app imports
        run: python -c "from app import app; assert app is not None; print('OK')"

      - name: Smoke test — train.py imports
        run: python -c "import train; print('OK')"
