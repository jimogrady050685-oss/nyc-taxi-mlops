# .github/workflows/retrain.yml
# ======================================================
# Handles the Continuous Training stage of the pipeline.
#
# Three ways this can fire:
#   1. On a schedule every Sunday at 02:00 UTC to pick up the latest TLC data
#   2. Manually from the Actions tab using the Run Workflow button
#   3. Via a repository_dispatch event fired by an external tool like Grafana if it detects model drift or accuracy dropping below a threshold
#
# Rather than duplicating the pipeline logic here, this workflow calls ml-pipeline.yml as a reusable workflow.
# That means a retrain goes through the exact same preprocess, train and build steps as a normal release.
# Full MLflow logging and artifact lineage included.

name: "CT — Retrain Model"

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      sample_fraction:
        description: "Fraction of dataset to use for retraining (0.0 to 1.0)"
        default: "0.1"
        required: false
      reason:
        description: "Why is this retrain being triggered?"
        default: "manual"
        required: false

  # An external monitoring tool can POST to the GitHub API to fire this.
  # The event type model-drift-detected acts as the trigger.
  repository_dispatch:
    types: [model-drift-detected]

jobs:

  # Logs what triggered this run so it shows up clearly in the Actions tab.
  log-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Log retrain trigger
        run: |
          echo "Retrain triggered."
          echo "Event: ${{ github.event_name }}"
          echo "Reason: ${{ github.event.inputs.reason || 'scheduled or external' }}"
          echo "Sample fraction: ${{ github.event.inputs.sample_fraction || '0.1' }}"

  # Calls the main pipeline as a reusable workflow.
  # Will not start until the log-trigger job finishes.
  # secrets: inherit passes the Docker Hub credentials through automatically.
  #
  # Note: GitHub does not support passing workflow_dispatch inputs directly into a reusable workflow
  # call so ml-pipeline.yml uses its own defaults.
  # In a production setup you would convert the training step to read a workflow_call input instead.
  retrain-pipeline:
    needs: log-trigger
    uses: ./.github/workflows/ml-pipeline.yml
    secrets: inherit