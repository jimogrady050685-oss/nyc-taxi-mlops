# k8s/service.yaml
# =================
# Exposes the Flask API to network traffic.
#
# Inside the cluster it picks up any pod labelled app: taxi-fare and routes traffic to port 5000 where gunicorn is listening.
# NodePort makes it reachable from outside the cluster on port 30500 of the Kind node. 
# That is what the curl commands hit during the demo.
#
# NodePort was chosen over ClusterIP because ClusterIP is internal only, and LoadBalancer requires a cloud provider which Kind does not have.

apiVersion: v1
kind: Service
metadata:
  name: taxi-fare-service
  labels:
    app: taxi-fare
spec:
  type: NodePort

  selector:
    app: taxi-fare

  ports:
    - name: http
      port: 80          # port inside the cluster
      targetPort: 5000  # port the container is listening on
      nodePort: 30500   # port exposed on the Kind node (range is 30000 to 32767)
      protocol: TCP