# k8s/deployment.yaml
# ====================
# Tells Kubernetes how to run the Flask API container.
# Argo CD watches this file and syncs any changes to the Kind cluster automatically.
#
# When a new image is pushed to Docker Hub, Argo CD detects the drift and triggers a rolling update.
# Kubernetes brings up the new pod, waits for it to pass the health check, then terminates the old one.
# That is how zero downtime deployments work here.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-fare
  labels:
    app: taxi-fare
spec:
  # One replica is fine for a demo environment.
  # Increasing this number scales the API out horizontally and Kubernetes handles the rolling update automatically.
  replicas: 1
  selector:
    matchLabels:
      app: taxi-fare
  template:
    metadata:
      labels:
        app: taxi-fare
    spec:
      containers:
        - name: taxi-fare
          image: jcogrady/nyctaxi-fare:latest
          # Always re-pull the image when a pod starts.
          # This is how new model versions get picked up after a retrain pushes a fresh :latest image to Docker Hub.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # Resource limits stop one pod from consuming the whole Kind cluster.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # Kubernetes restarts the pod if /health stops responding.
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Kubernetes will not route any traffic to this pod until /health returns 200.
          # Combined with the liveness probe above this gives us zero downtime rolling updates.
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3