# docker-compose.yml
# ===================
# Used for local development and testing only.
# The production deployment runs on Kubernetes via Argo CD.
#
# Two services:
#   train  — runs train.py once, writes the model file, then exits
#   api    — runs gunicorn serving app.py on port 5000
#
# Usage:
#   Start the API:       docker compose up api
#   Run a training job:  docker compose run --rm train
#   Run both:            docker compose up

version: "3.9"

services:

  # Runs train.py and exits. 
  # Does not stay running.
  # Writes gbt_model.joblib to the shared models/ volume.
  train:
    build: .
    image: ${DOCKER_IMAGE:-nyctaxi-fare:latest}
    command: python train.py
    environment:
      - MODEL_DIR=/app/models
      - DATA_DIR=/tmp/data
      - SAMPLE_FRACTION=${SAMPLE_FRACTION:-0.2}
    volumes:
      - ./models:/app/models
      - taxi-data:/tmp/data

  # Runs gunicorn serving app.py. 
  # Stays running.
  # Reads the model file that the train service wrote to the shared volume.
  api:
    build: .
    image: ${DOCKER_IMAGE:-nyctaxi-fare:latest}
    ports:
      - "5000:5000"
    environment:
      - MODEL_DIR=/app/models
      - MODEL_PATH=/app/models/gbt_model.joblib
      - METRICS_PATH=/app/models/metrics.json
      - PORT=5000
    volumes:
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  taxi-data:  # caches the downloaded parquet file between training runs