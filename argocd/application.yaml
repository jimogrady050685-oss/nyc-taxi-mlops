# argocd/application.yaml
# ========================
# This is what makes the Continuous Delivery stage work.
# Applied once to the cluster and Argo CD takes over from there.
#
# It tells Argo CD to watch the k8s/ folder of this repo on the main branch.
# Any change pushed there gets automatically applied to the Kubernetes cluster within about 3 minutes. 
# No manual kubectl commands, no SSH from GitHub Actions.
# The cluster pulls from Git rather than CI pushing to the cluster.
# That is the GitOps pattern.
#
# To apply it the first time:
#   kubectl apply -n argocd -f argocd/application.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: taxi-fare
  namespace: argocd
  finalizers:
    # When this application is deleted, Argo CD cleans up everything it created in the cluster too. Without this, pods would be left behind.
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  # Where Argo CD reads the desired state from.
  source:
    repoURL:        https://github.com/jimogrady050685-oss/nyc-taxi-mlops.git
    targetRevision: main
    path:           k8s

  # Where Argo CD applies the resources to.
  destination:
    # https://kubernetes.default.svc is the in-cluster API server address.
    # Argo CD is running inside the Kind cluster so this is how it communicates with Kubernetes without needing an external endpoint.
    server:    https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      # If a resource is removed from the repo, remove it from the cluster too.
      prune:    true
      # If someone manually changes something in the cluster, revert it back to match what is in Git. 
      # Git is the single source of truth here.
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

  revisionHistoryLimit: 5